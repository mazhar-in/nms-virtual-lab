<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f1f3d" />
      <stop offset="60%" stop-color="#070d1a" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.4" />

  <!-- NMS Monogram Banner Top -->
  <g transform="translate(256, 75)" text-anchor="middle">
    <rect x="-85" y="-18" width="170" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="6" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="4">NMS LABS</text>
  </g>

  <!-- Physics Orbital Rings -->
  <g transform="translate(256, 266)" filter="url(#glow)">
    <!-- Orbit 1 (Horizontal tilt) -->
    <ellipse rx="150" ry="52" fill="none" stroke="url(#cyanGrad)" stroke-width="5" transform="rotate(-30)" opacity="0.9"/>
    <!-- Orbit 2 (Opposite tilt) -->
    <ellipse rx="150" ry="52" fill="none" stroke="url(#goldGrad)" stroke-width="5" transform="rotate(30)" opacity="0.9"/>
    <!-- Orbit 3 (Vertical tilt) -->
    <ellipse rx="150" ry="52" fill="none" stroke="url(#purpleGrad)" stroke-width="5" transform="rotate(90)" opacity="0.85"/>

    <!-- Orbital Electrons / Quantum Nodes -->
    <circle cx="130" cy="-75" r="9" fill="#38bdf8" />
    <circle cx="-130" cy="75" r="9" fill="#38bdf8" />
    <circle cx="130" cy="75" r="9" fill="#fde047" />
    <circle cx="-130" cy="-75" r="9" fill="#fde047" />
    <circle cx="0" cy="-150" r="9" fill="#c084fc" />
    <circle cx="0" cy="150" r="9" fill="#c084fc" />

    <!-- Center Nucleus: Glowing Core & Physics Vernier Calliper Emblem -->
    <circle cx="0" cy="0" r="42" fill="url(#cyanGrad)" opacity="0.25"/>
    <circle cx="0" cy="0" r="32" fill="#0c162c" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Stylized Calliper / Measurement Icon inside Nucleus -->
    <path d="M -14,-14 L 14,-14 L 14,-6 L 6,-6 L 6,14 L -6,14 L -6,-6 L -14,-6 Z" fill="#38bdf8" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Bottom Title: Virtual Physics Lab -->
  <g transform="translate(256, 456)" text-anchor="middle">
    <text y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="1">PHYSICS VIRTUAL LAB</text>
    <text y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="2">NATIONAL MODEL SCHOOLS</text>
  </g>
</svg>
